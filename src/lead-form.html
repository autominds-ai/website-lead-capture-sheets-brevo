<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Form Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6f5fb; color: #1d1b2e; margin: 0; padding: 32px 16px; }
    .card { max-width: 440px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 8px 30px rgba(40, 20, 90, .08); }
    h1 { font-size: 1.4rem; margin: 0 0 6px; }
    p { color: #5b5870; margin: 0 0 20px; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 6px; }
    input, select { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #d8d5e6; border-radius: 8px; font: inherit; }
    button { margin-top: 22px; width: 100%; padding: 13px; border: 0; border-radius: 8px; background: #5b2be0; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
    #success-state { display: none; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div id="form-content">
      <h1>Get the free guide</h1>
      <p>Demo form. With no webhook set, the lead is printed to the browser console.</p>
      <form id="lead-form" novalidate>
        <label for="name">Name</label>
        <input id="name" autocomplete="name">
        <label for="phone">Phone / WhatsApp</label>
        <input id="phone" type="tel" autocomplete="tel">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email">
        <label for="business">Business type</label>
        <select id="business">
          <option value="">Choose one</option>
          <option value="real-estate">Real estate</option>
          <option value="clinic">Medical / dental clinic</option>
          <option value="other">Other</option>
        </select>
        <label for="challenge">Biggest challenge</label>
        <select id="challenge">
          <option value="">Choose one</option>
          <option value="slow-replies">Replying to enquiries fast enough</option>
          <option value="follow-up">Following up with leads</option>
          <option value="bookings">Bookings and no-shows</option>
        </select>
        <button type="submit">Send me the guide</button>
      </form>
    </div>
    <div id="success-state">
      <h1>Thank you!</h1>
      <p>Check your email for the guide.</p>
    </div>
  </div>
  <script src="lead-capture.js"></script>
</body>
</html>
